name: Release

# Push a tag to publish a release with the extension zip attached:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The `permissions: contents: write` block below grants this workflow alone
# what it needs to publish a release. Leave the repo-wide default
# (Settings -> Actions -> General -> Workflow permissions) at read-only so
# every other workflow keeps a read-only token.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Build the zip
        run: ./scripts/build-zip.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/movie-rating-check.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/movie-rating-check.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
