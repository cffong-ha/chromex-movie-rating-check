name: Release

# Push a tag to publish a release with the extension zip attached:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Needs Settings -> Actions -> General -> Workflow permissions set to
# "Read and write permissions", otherwise the release step is denied.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Build the zip
        run: ./scripts/build-zip.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/movie-rating-check.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/movie-rating-check.zip \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
